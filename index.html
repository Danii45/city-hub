<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>City Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* City Hub: a plain black screen with a button for each city. Same pixel style as the cities themselves. */
:root{
  --bg:#000;
  --ink:#f1ebe0;
  --ink-soft:#9a9086;
  --accent:#e0783c;
  --line:#f1ebe0;
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0; min-height:100%; background:var(--bg); color:var(--ink);}
body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:calc(56px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px));
  font-family:'Press Start 2P', monospace;
}
h1{
  margin:0 0 12px;
  font-size:clamp(24px, 7vw, 44px);
  letter-spacing:3px;
  text-align:center;
}
.sub{
  margin:0 0 44px;
  font-family:'VT323', monospace;
  font-size:22px;
  color:var(--ink-soft);
  text-align:center;
}
.cities{
  display:flex;
  flex-direction:column;
  gap:20px;
  width:min(100%, 420px);
}
.city{
  display:block;
  width:100%;
  padding:18px 20px;
  font-family:inherit;
  text-align:left;
  text-decoration:none;
  color:#fff;
  background:var(--accent);
  border:3px solid var(--line);
  box-shadow:5px 5px 0 0 var(--line);
  cursor:pointer;
}
.city:hover{filter:brightness(1.08);}
.city:active{transform:translate(3px,3px); box-shadow:2px 2px 0 0 var(--line);}
.city:focus-visible{outline:3px solid #ffd23f; outline-offset:4px;}
.city .name{display:flex; align-items:center; gap:10px; font-size:16px; line-height:1.4;}
.city .pill{
  padding:3px 5px 2px;
  font-size:8px;
  color:var(--accent);
  background:#fff;
  border:2px solid #000;
}
.city .desc{margin-top:8px; font-family:'VT323', monospace; font-size:20px; line-height:1.15; color:#fff3e8;}
.city.soon{
  color:var(--ink-soft);
  background:transparent;
  border:3px dashed #555;
  box-shadow:none;
  cursor:not-allowed;
}
.city.soon:hover{filter:none;}
.city.soon:active{transform:none;}
.city.soon .desc{color:var(--ink-soft);}
</style>
</head>
<body>
  <h1>CITY HUB</h1>
  <p class="sub">Pick a city to play.</p>
  <main class="cities">
    <a class="city" href="cell-city.html">
      <span class="name">CELL CITY <span class="pill">1.2</span></span>
      <div class="desc">An animal cell, built as a town.</div>
    </a>
    <button class="city soon" type="button" disabled>
      <span class="name">COMING SOON</span>
      <div class="desc">A new city is on the way.</div>
    </button>
  </main>
</body>
</html>
